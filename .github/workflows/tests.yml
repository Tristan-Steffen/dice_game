name: Tests

on:
  push:
  pull_request:

jobs:
  gut:
    # Zwei Runner-VMs statt zwei Prozessen auf einer: auf EINER Maschine ist
    # Godot schon ausgelastet (lokal gemessen: parallel 135 s vs. seriell 65 s).
    name: GUT ${{ matrix.dir }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [unit, integration]
    env:
      GODOT_VERSION: "4.7-stable"
    steps:
      - uses: actions/checkout@v4

      # Der Import-Pass dominiert die Jobzeit (~9 min fuer 221 MB Assets); der
      # Cache drueckt ihn auf Sekunden. restore-keys reicht auch veraltet: der
      # Import-Pass unten prueft selbst und importiert nur Geändertes nach.
      - name: Restore import cache
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless)
        run: |
          set -e
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          wget -q "$url" -O godot.zip
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # Imports resources and registers global class_names (GutTest, Charm, ...)
      # so the test run can resolve them. Import warnings must not fail the job -
      # the test step below is the real gate (it errors if classes are missing).
      - name: Import project
        run: godot --headless --editor --quit || true

      # --fixed-fps 60 koppelt die Frames von der Echtzeit ab (Delta fest 1/60):
      # die wait_frames/wait_seconds der Integrationstests laufen so schnell wie
      # die CPU tickt statt in Echtzeit zu warten.
      - name: Run ${{ matrix.dir }} tests
        run: godot --headless --fixed-fps 60 -s addons/gut/gut_cmdln.gd -gconfig=res://.gutconfig.json -gdir=res://test/${{ matrix.dir }}
